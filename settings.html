<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TB Labels Sync - Einstellungen</title>
  <style>
    body {
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 30px 0;
      font-size: 24px;
      font-weight: 600;
    }

    .section {
      margin-bottom: 30px;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background-color: #f9f9f9;
    }

    .section h2 {
      margin: 0 0 15px 0;
      font-size: 18px;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
    }

    input[type="text"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }

    input[type="checkbox"] {
      margin-right: 8px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      font-weight: normal;
      margin-bottom: 10px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      background-color: #0060df;
      color: white;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
      margin-right: 10px;
    }

    button:hover {
      background-color: #003eaa;
    }

    button.secondary {
      background-color: #5e5e5e;
    }

    button.secondary:hover {
      background-color: #3e3e3e;
    }

    .hint {
      color: #666;
      font-size: 12px;
      margin-top: 5px;
    }

    .detected-paths {
      margin-top: 10px;
      padding: 10px;
      background-color: #e7f3ff;
      border-radius: 4px;
    }

    .detected-paths h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
      font-weight: 600;
    }

    .path-option {
      margin: 5px 0;
      padding: 8px;
      background-color: white;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid #ccc;
    }

    .path-option:hover {
      background-color: #f0f0f0;
    }

    .status-message {
      padding: 10px;
      margin-top: 15px;
      border-radius: 4px;
      display: none;
    }

    .status-message.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status-message.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>
  <h1>TB Labels Sync - Einstellungen</h1>

  <div class="section">
    <h2>Synchronisierungsdatei</h2>

    <div class="form-group">
      <label for="syncFilePath">Dateipfad:</label>
      <input type="text" id="syncFilePath" placeholder="/pfad/zu/thunderbird-tags.json">
      <div class="hint">Gib den vollständigen Pfad zur JSON-Datei an, die synchronisiert werden soll.</div>
    </div>

    <div id="detectedPaths" class="detected-paths" style="display: none;">
      <h3>Erkannte Syncthing-Ordner:</h3>
      <div id="pathList"></div>
    </div>

    <button id="detectSyncthingBtn" class="secondary">Syncthing-Ordner erkennen</button>
    <button id="browseBtn" class="secondary">Durchsuchen...</button>
  </div>

  <div class="section">
    <h2>Synchronisierungsoptionen</h2>

    <div class="form-group">
      <label class="checkbox-label">
        <input type="checkbox" id="autoSync">
        Automatische Synchronisierung (alle 5 Minuten)
      </label>

      <label class="checkbox-label">
        <input type="checkbox" id="syncOnChange">
        Bei Änderungen synchronisieren
      </label>

      <label class="checkbox-label">
        <input type="checkbox" id="manualSync">
        Manuellen Sync-Button anzeigen
      </label>
    </div>
  </div>

  <div class="section">
    <h2>Sync-Service</h2>

    <div class="form-group">
      <label class="checkbox-label">
        <input type="radio" name="syncService" value="syncthing" id="syncServiceSyncthing" checked>
        Syncthing
      </label>

      <label class="checkbox-label">
        <input type="radio" name="syncService" value="smb" id="syncServiceSmb">
        SMB-Freigabe
      </label>

      <label class="checkbox-label">
        <input type="radio" name="syncService" value="manual" id="syncServiceManual">
        Manuell (eigener Pfad)
      </label>
    </div>
  </div>

  <button id="saveBtn">Einstellungen speichern</button>
  <button id="testSyncBtn" class="secondary">Sync testen</button>

  <div id="statusMessage" class="status-message"></div>

  <script src="settings.js"></script>
</body>
</html>
