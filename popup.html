<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TB Labels Sync</title>
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }

    h2 {
      margin: 0 0 15px 0;
      font-size: 16px;
      font-weight: 600;
    }

    .status {
      margin-bottom: 15px;
      padding: 10px;
      border-radius: 4px;
      background-color: #f0f0f0;
    }

    .status-label {
      font-weight: 600;
      margin-bottom: 5px;
    }

    .status-value {
      color: #666;
    }

    .status.success {
      background-color: #d4edda;
      color: #155724;
    }

    .status.error {
      background-color: #f8d7da;
      color: #721c24;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: none;
      border-radius: 4px;
      background-color: #0060df;
      color: white;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover {
      background-color: #003eaa;
    }

    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    .settings-link {
      display: block;
      text-align: center;
      color: #0060df;
      text-decoration: none;
      margin-top: 10px;
    }

    .settings-link:hover {
      text-decoration: underline;
    }

    #syncingMessage {
      display: none;
      text-align: center;
      color: #666;
      margin: 10px 0;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #2a2a2e;
        color: #f9f9fa;
      }

      .status {
        background-color: #38383d;
      }

      .status-value {
        color: #b1b1b3;
      }

      .status.success {
        background-color: #1d3b29;
        color: #87d7a3;
      }

      .status.error {
        background-color: #4a2327;
        color: #f4a8ae;
      }

      .settings-link {
        color: #45a1ff;
      }

      #syncingMessage {
        color: #b1b1b3;
      }
    }
  </style>
</head>
<body>
  <h2>TB-TaXync</h2>

  <div id="statusContainer" class="status">
    <div class="status-label">Last Sync:</div>
    <div class="status-value" id="lastSyncTime">Never</div>
    <div class="status-value" id="syncStatus"></div>
    <div class="status-value" id="syncDetails" style="font-size: 11px; margin-top: 5px;"></div>
  </div>

  <button id="syncButton">Sync Now</button>

  <div id="syncingMessage">Syncing...</div>

  <a href="#" id="settingsLink" class="settings-link">Open Settings</a>

  <script src="popup.js"></script>
</body>
</html>
