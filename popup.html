<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TB Labels Sync</title>
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }

    h2 {
      margin: 0 0 15px 0;
      font-size: 16px;
      font-weight: 600;
    }

    .status {
      margin-bottom: 15px;
      padding: 10px;
      border-radius: 4px;
      background-color: #f0f0f0;
    }

    .status-label {
      font-weight: 600;
      margin-bottom: 5px;
    }

    .status-value {
      color: #666;
    }

    .status.success {
      background-color: #d4edda;
      color: #155724;
    }

    .status.error {
      background-color: #f8d7da;
      color: #721c24;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: none;
      border-radius: 4px;
      background-color: #0060df;
      color: white;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover {
      background-color: #003eaa;
    }

    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    .settings-link {
      display: block;
      text-align: center;
      color: #0060df;
      text-decoration: none;
      margin-top: 10px;
    }

    .settings-link:hover {
      text-decoration: underline;
    }

    #syncingMessage {
      display: none;
      text-align: center;
      color: #666;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <h2>TB Labels Sync</h2>

  <div id="statusContainer" class="status">
    <div class="status-label">Letzter Sync:</div>
    <div class="status-value" id="lastSyncTime">Nie</div>
    <div class="status-value" id="syncStatus"></div>
  </div>

  <button id="syncButton">Jetzt synchronisieren</button>

  <div id="syncingMessage">Synchronisierung läuft...</div>

  <a href="#" id="settingsLink" class="settings-link">Einstellungen öffnen</a>

  <script src="popup.js"></script>
</body>
</html>
