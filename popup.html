<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thunderbird Sync Labels</title>
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 14px;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 15px 0;
      color: #333;
    }

    .section {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #0078d4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background-color: #106ebe;
    }

    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    .status {
      padding: 8px;
      border-radius: 4px;
      margin-top: 10px;
      font-size: 13px;
    }

    .status.success {
      background-color: #dff0d8;
      color: #3c763d;
    }

    .status.error {
      background-color: #f2dede;
      color: #a94442;
    }

    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #0078d4;
    }

    input:checked + .slider:before {
      transform: translateX(26px);
    }
  </style>
</head>
<body>
  <h1>🔄 Tag Sync</h1>

  <div class="section">
    <button id="syncNow">🔄 Sync Now</button>
  </div>

  <div class="section" style="margin-top: 8px;">
    <div class="toggle-container">
      <label for="syncToggle">Auto-Sync (1h)</label>
      <label class="switch">
        <input type="checkbox" id="syncToggle">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div id="status" class="status" style="display: none;"></div>

  <details style="margin-top: 15px;">
    <summary style="cursor: pointer; color: #666; font-size: 12px;">⚙️ Advanced</summary>
    <div style="margin-top: 10px;">
      <button id="settingsButton" style="width: 100%; background-color: #6c757d;">⚙️ Settings</button>
      <button id="logsButton" style="width: 100%; margin-top: 5px; background-color: #6c757d;">📋 Logs</button>
    </div>
  </details>

  <script src="popup.js"></script>
</body>
</html>
